[project]
name = "product-quote-mcp-practice"
version = "0.1.0"
description = "MCP practical implementation assignment: product quotations"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mcp==2.3.0",
    "httpx==0.28.1",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
